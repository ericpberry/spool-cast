<!doctype html>
<!--
  Spool's Cast receiver (D-107, D-112). A static page the TV loads when Spool casts; published from
  the private spool repo's receiver/ folder to the public ericpberry/spool-cast repo (GitHub Pages).
  Posts and their timings come from the phone on Spool's Cast channel, audio from the phone over the
  home network, post photos from Bluesky's image CDN. Nothing else is fetched except Google's Cast
  receiver library. Add ?preview=post|photo|link|summary|caught|end|hub to see a state in a browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spool</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body tabindex="-1">
  <audio id="audio"></audio>

  <main id="idle" class="screen idle">
    <img class="wordmark-big" src="wordmark.svg" alt="spool.">
    <p class="hint">Ready to play from Spool on your phone</p>
  </main>

  <main id="post" class="screen post" hidden>
    <section class="main">
      <header class="top">
        <img class="wordmark" src="wordmark.svg" alt="spool.">
        <span id="live" class="live" hidden>LIVE</span>
      </header>
      <section class="head">
        <h1 id="headline"></h1>
        <p id="meta" class="meta"></p>
      </section>
      <section id="body" class="body">
        <div id="summary" class="summary" hidden>
          <p class="label">Catching you up</p>
          <ul id="points"></ul>
        </div>
        <div id="content" class="content">
          <article id="text" class="text"></article>
        </div>
      </section>
      <div id="bar" class="bar"></div>
    </section>
    <!-- D-117: the side column holds the post's photo when it has one, else what's secondary:
         the thread's abbreviations, link and quote cards, the quoted status, and behind live. -->
    <aside id="side" class="side">
      <figure id="photo" class="photo" hidden>
        <img id="photoImg" alt="">
        <figcaption id="photoAlt"></figcaption>
        <p id="photoMore" class="more"></p>
      </figure>
      <div id="info" class="info">
        <section id="terms" hidden>
          <p class="label">In this thread</p>
          <dl id="glossary"></dl>
        </section>
        <div id="cardsSide" class="cardsSide"></div>
      </div>
      <!-- D-118: in both views, under the abbreviations or under the photo. -->
      <section id="stand" class="stand">
        <p class="label">Where things stand</p>
        <p id="note" class="note" hidden></p>
        <p id="behind" class="behind"></p>
      </section>
    </aside>
    <div id="toast" class="toast" hidden></div>
    <span id="paused" class="paused" hidden>❚❚ Paused</span>
    <nav id="touch" class="touch">
      <button data-ask="previous" aria-label="Previous post">⏮</button>
      <button data-ask="toggle" class="pp" aria-label="Play or pause">❚❚</button>
      <button data-ask="next" aria-label="Next post">⏭</button>
    </nav>
  </main>

  <main id="caught" class="screen center" hidden>
    <img class="corner" src="wordmark.svg" alt="spool.">
    <div>
      <div class="pulse"></div>
      <h2 id="caughtTitle" class="big">You're caught up</h2>
      <p id="caughtText" class="small"></p>
    </div>
  </main>

  <main id="end" class="screen board" hidden>
    <header class="top"><img class="wordmark" src="wordmark.svg" alt="spool."></header>
    <section class="head">
      <h1 id="endHead"></h1>
      <p id="endSub" class="meta"></p>
    </section>
    <div id="cards" class="cards"></div>
  </main>

  <script src="receiver.js"></script>
</body>
</html>
